<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JugaadBites: The Idiot-Proof Recipe Finder</title>
    <meta name="description" content="Zero culinary jargon. Zero panic. Survival recipes for absolute beginners." />
    <meta name="robots" content="index, follow" />

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#e65e3d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JugaadBites" />
    <meta name="application-name" content="JugaadBites" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="JugaadBites: The Idiot-Proof Recipe Finder" />
    <meta property="og:description" content="Zero culinary jargon. Zero panic. Survival recipes for absolute beginners." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JugaadBites: The Idiot-Proof Recipe Finder" />
    <meta name="twitter:description" content="Zero culinary jargon. Zero panic. Survival recipes for absolute beginners." />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[PWA] Service Worker registered successfully:', reg.scope);
          }).catch((err) => {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
